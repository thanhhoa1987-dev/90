<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chữa bài từ vựng lớp 6 – Units 1–3</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#16243d;background:#eaf0fa}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:20px}.top{background:linear-gradient(110deg,#163c84,#2769be);color:#fff;border-radius:18px;padding:22px 28px;box-shadow:0 10px 30px #15357522}.top h1{font-size:clamp(23px,3vw,34px);margin:5px 0}.top p{margin:0;opacity:.88}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}.pill{padding:8px 12px;border-radius:30px;background:#fff;color:#233b60;font-weight:700}.progress{height:10px;background:#d1dff2;border-radius:20px;overflow:hidden;flex:1;min-width:140px}.progress>div{height:100%;background:#25a0a3;transition:width .25s}.slide{background:white;border-radius:20px;padding:clamp(20px,3vw,40px);box-shadow:0 10px 35px #243a631a;min-height:460px}.section{font-weight:800;color:#2479ae;letter-spacing:.06em}.question{font-size:clamp(24px,3vw,35px);font-weight:700;line-height:1.48;margin:20px 0 25px}.options{display:grid;grid-template-columns:1fr 1fr;gap:15px}.option{display:flex;align-items:flex-start;gap:13px;border:2px solid #dfe7f1;padding:17px 20px;border-radius:13px;font-size:clamp(19px,2.1vw,26px);font-weight:600;min-height:76px;transition:.2s}.option .letter{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:9px;background:#e8eef7;color:#31569a}.option.correct{background:#e2f8e9;border-color:#19a75b;color:#07632e}.option.correct .letter{background:#0b9f52;color:white}.explain{background:#f3f7ff;border-left:6px solid #3280ce;padding:18px 22px;border-radius:12px;margin-top:25px;font-size:clamp(17px,1.7vw,21px);line-height:1.6}.explain b{color:#174b94}.hidden{display:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font:700 17px system-ui;background:#fff;color:#1b438a;box-shadow:0 3px 15px #1939621c}button.primary{background:#155bbe;color:#fff}button.reveal{background:#0d8f72;color:#fff}button:disabled{opacity:.35;cursor:not-allowed}.numbers{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}.numbers button{padding:7px 10px;font-size:13px;border-radius:7px;min-width:35px}.numbers button.active{background:#1d5fbc;color:white}.numbers button.done:not(.active){background:#dff5e5;color:#066939}.hint{font-size:14px;opacity:.8;margin:14px 3px}.footer{font-size:14px;color:#64728a;margin:20px 0;text-align:center}@media(max-width:650px){.options{grid-template-columns:1fr}.slide{min-height:unset}.question{font-size:24px}.app{padding:10px}}
@media print{.controls,.numbers,.hint{display:none}.slide{box-shadow:none}}
</style></head><body><main class="app"><header class="top"><div>ENGLISH 6 · GLOBAL SUCCESS · A2</div><h1>CHỮA BÀI TỪ VỰNG – UNITS 1, 2 &amp; 3</h1><p>30 câu trắc nghiệm | Hiện đáp án từng câu và giải thích cụ thể</p></header><div class="toolbar"><span class="pill" id="counter"></span><span class="pill" id="unit"></span><div class="progress"><div id="bar"></div></div><span class="pill" id="seen"></span></div><section class="slide"><div class="section" id="heading"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="explain hidden" id="explain"></div></section><nav class="controls"><button id="prev">← Câu trước</button><button class="reveal" id="reveal">✓ Hiện đáp án + giải thích</button><button class="primary" id="next">Câu tiếp →</button><button id="reset">↺ Ẩn toàn bộ đáp án</button></nav><div class="hint">⌨️ <b>Space</b>: hiện/ẩn đáp án · <b>← →</b>: chuyển câu · Nhấp số câu để chuyển nhanh.</div><nav class="numbers" id="numbers" aria-label="Chọn câu hỏi"></nav><div class="footer">Web độc lập, không cần Internet · Dùng trình chiếu trực tiếp trên lớp</div></main><script>
const DATA=[{"q": "During the Geography lesson, our teacher uses a _____ to show us where different countries are on Earth.", "opts": ["ruler", "globe", "compass", "calculator"], "answer": 1, "why": "Globe = quả địa cầu, mô hình Trái Đất giúp xác định các quốc gia. Ruler là thước kẻ; compass là compa; calculator là máy tính cầm tay.", "unit": 1}, {"q": "I made a spelling mistake in my notebook, so I need a _____ to correct it.", "opts": ["rubber", "glue", "paper clip", "pencil sharpener"], "answer": 0, "why": "Rubber = cục tẩy (Anh–Anh), dùng để tẩy chữ viết bằng bút chì. Glue = keo dán; paper clip = kẹp giấy; pencil sharpener = gọt bút chì.", "unit": 1}, {"q": "Our teacher uses a _____ to show pictures and videos on the classroom screen.", "opts": ["computer", "clock", "projector", "dictionary"], "answer": 2, "why": "Projector = máy chiếu, dùng để chiếu hình ảnh/video lên màn hình. Computer có thể phát nội dung nhưng thiết bị chiếu lên màn hình là projector.", "unit": 1}, {"q": "My pencil is too short and its point is broken. Can I borrow your _____?", "opts": ["pencil case", "pencil sharpener", "scissors", "coloured pencils"], "answer": 1, "why": "Pencil sharpener = đồ gọt bút chì, dùng khi đầu chì bị cùn hoặc gãy. Pencil case là hộp bút; scissors là kéo; coloured pencils là bút chì màu.", "unit": 1}, {"q": "We are making birthday cards for our classmates. We need some _____ to stick the pictures onto the cards.", "opts": ["glue", "paper clips", "rulers", "rubbers"], "answer": 0, "why": "Glue = hồ/keo dán, đi với động từ stick (dán). Paper clips chỉ kẹp giấy, rulers dùng kẻ và rubbers dùng tẩy.", "unit": 1}, {"q": "There are so many new English words in this story. I need a _____ to check their meanings.", "opts": ["textbook", "notebook", "dictionary", "calculator"], "answer": 2, "why": "Dictionary = từ điển, dùng để tra nghĩa của từ (check meanings). Textbook = sách giáo khoa; notebook = vở; calculator = máy tính.", "unit": 1}, {"q": "Please put the empty milk carton in the _____ instead of leaving it on your desk.", "opts": ["bookcase", "bin", "school bag", "lunch box"], "answer": 1, "why": "Bin = thùng rác. Empty milk carton (vỏ hộp sữa đã hết) cần được bỏ đúng nơi; bookcase = tủ sách, school bag = cặp, lunch box = hộp cơm.", "unit": 1}, {"q": "We learn about important events and famous people from the past in our _____ lessons.", "opts": ["Music", "Science", "Physics", "History"], "answer": 3, "why": "History = môn Lịch sử, nghiên cứu sự kiện và nhân vật trong quá khứ. Music = Âm nhạc; Science = Khoa học; Physics = Vật lí.", "unit": 1}, {"q": "Mai keeps her sandwiches, fruit and a small bottle of water in her _____.", "opts": ["lunch box", "pencil case", "school bag", "bookcase"], "answer": 0, "why": "Lunch box = hộp cơm/hộp đựng bữa trưa, thích hợp để mang đồ ăn. Pencil case = hộp bút; school bag = cặp; bookcase = tủ sách.", "unit": 1}, {"q": "The teacher gives us five maths problems to do at home. We must finish our _____ before tomorrow's lesson.", "opts": ["vocabulary", "school lunch", "homework", "football"], "answer": 2, "why": "Homework = bài tập về nhà; dấu hiệu là “to do at home” và “finish ... before tomorrow’s lesson”. Vocabulary = từ vựng; school lunch = bữa trưa ở trường; football = bóng đá.", "unit": 1}, {"q": "My family lives on the fifth floor of a tall building. Our _____ has two bedrooms and a small kitchen.", "opts": ["villa", "apartment", "palace", "stilt house"], "answer": 1, "why": "Apartment = căn hộ trong tòa nhà nhiều tầng. Villa = biệt thự; palace = cung điện; stilt house = nhà sàn.", "unit": 2}, {"q": "Dad parks his car in the _____ every evening to keep it safe from the rain.", "opts": ["basement", "attic", "garage", "hall"], "answer": 2, "why": "Garage = nhà để xe. Basement = tầng hầm có thể dùng để đỗ xe trong một số nhà, nhưng “garage” gọi đúng không gian chuyên để ô tô; attic = gác mái; hall = sảnh/hành lang.", "unit": 2}, {"q": "My mum cooks dinner in the _____ while my brother sets the table.", "opts": ["bathroom", "bedroom", "living room", "kitchen"], "answer": 3, "why": "Kitchen = nhà bếp, nơi nấu ăn (cooks dinner). Bathroom = phòng tắm; bedroom = phòng ngủ; living room = phòng khách.", "unit": 2}, {"q": "We keep old suitcases and Christmas decorations in the _____ just under the roof.", "opts": ["attic", "hall", "bathroom", "garage"], "answer": 0, "why": "Attic = gác mái, nằm ngay dưới mái nhà (just under the roof). Hall = sảnh/hành lang; bathroom = phòng tắm; garage = nhà để xe.", "unit": 2}, {"q": "Our family often sits on the sofa in the _____ to watch television after dinner.", "opts": ["kitchen", "living room", "bedroom", "bathroom"], "answer": 1, "why": "Living room = phòng khách/phòng sinh hoạt chung, thường có sofa và tivi. Những phòng còn lại có chức năng chính khác.", "unit": 2}, {"q": "My uncle has a beautiful house with a large garden and a swimming pool. It is a _____.", "opts": ["townhouse", "warehouse", "villa", "apartment"], "answer": 2, "why": "Villa = biệt thự, thường rộng rãi và có sân vườn, có thể có hồ bơi. Townhouse = nhà phố; warehouse = nhà kho; apartment = căn hộ.", "unit": 2}, {"q": "My mother's sister is my _____. She often visits us at weekends.", "opts": ["aunt", "cousin", "daughter", "grandma"], "answer": 0, "why": "Aunt = cô/dì/bác gái; “my mother’s sister” chính là dì/bác gái. Cousin = anh/chị/em họ; daughter = con gái; grandma = bà.", "unit": 2}, {"q": "Tom is my uncle's son, so he is my _____.", "opts": ["brother", "son", "grandpa", "cousin"], "answer": 3, "why": "Cousin = anh/chị/em họ. “My uncle’s son” là con trai của chú/bác/cậu, tức anh/em họ của tôi.", "unit": 2}, {"q": "My grandparents live in a traditional _____ built on wooden posts above the ground.", "opts": ["palace", "stilt house", "townhouse", "apartment"], "answer": 1, "why": "Stilt house = nhà sàn, được dựng trên các cột cao khỏi mặt đất (wooden posts above the ground).", "unit": 2}, {"q": "The house has a _____ below the ground floor. We use it to store old furniture.", "opts": ["hall", "attic", "basement", "bathroom"], "answer": 2, "why": "Basement = tầng hầm, nằm bên dưới tầng trệt (below the ground floor). Attic thì nằm dưới mái nhà, không phải dưới tầng trệt.", "unit": 2}, {"q": "Lucy has beautiful _____ hair. It forms small rings around her face.", "opts": ["straight", "curly", "dark", "short"], "answer": 1, "why": "Curly hair = tóc xoăn, tạo thành những lọn vòng nhỏ (small rings). Straight = thẳng; dark = sẫm màu; short = ngắn.", "unit": 3}, {"q": "My grandfather has a grey _____ above his upper lip, but he has no beard.", "opts": ["eyebrow", "chin", "moustache", "cheek"], "answer": 2, "why": "Moustache = ria mép, mọc phía trên môi trên (above the upper lip). Beard = râu ở cằm/má; eyebrow = lông mày; chin = cằm.", "unit": 3}, {"q": "Anna always helps her classmates when they don't understand their homework. She is very _____.", "opts": ["shy", "boring", "serious", "helpful"], "answer": 3, "why": "Helpful = hay giúp đỡ. Dấu hiệu “always helps her classmates”. Shy = nhút nhát; boring = nhàm chán; serious = nghiêm túc.", "unit": 3}, {"q": "Ben loves asking questions about animals, space and the world around him. He is a very _____ boy.", "opts": ["curious", "patient", "shy", "sporty"], "answer": 0, "why": "Curious = tò mò, ham tìm hiểu; thường hay đặt câu hỏi (loves asking questions). Patient = kiên nhẫn; shy = nhút nhát; sporty = thích thể thao.", "unit": 3}, {"q": "My best friend is very _____. She can make everyone laugh with her funny stories.", "opts": ["serious", "funny", "sensitive", "quiet"], "answer": 1, "why": "Funny = vui tính/hài hước, làm mọi người cười. Serious = nghiêm túc; sensitive = nhạy cảm; quiet = ít nói/yên lặng.", "unit": 3}, {"q": "Lisa is _____ when she speaks in front of the class. She looks at everyone and speaks clearly.", "opts": ["shy", "curious", "confident", "sensitive"], "answer": 2, "why": "Confident = tự tin; nhìn vào mọi người và nói rõ ràng là biểu hiện sự tự tin. Shy = nhút nhát, không phù hợp.", "unit": 3}, {"q": "My sister loves drawing unusual pictures and thinking of new ideas. She is really _____.", "opts": ["reliable", "serious", "patient", "creative"], "answer": 3, "why": "Creative = sáng tạo. Dấu hiệu “unusual pictures” và “new ideas”. Reliable = đáng tin; serious = nghiêm túc; patient = kiên nhẫn.", "unit": 3}, {"q": "Jack never gives up when a maths problem is difficult. He works carefully until he finds the answer. He is very _____.", "opts": ["hard-working", "talkative", "sensitive", "funny"], "answer": 0, "why": "Hard-working = chăm chỉ, chịu khó làm đến khi xong. “Never gives up” cũng gợi ý kiên trì, nhưng trong bốn lựa chọn chỉ hard-working phù hợp nhất.", "unit": 3}, {"q": "Emma always keeps her promises. I know I can trust her because she is _____.", "opts": ["curious", "reliable", "shy", "talkative"], "answer": 1, "why": "Reliable = đáng tin cậy; giữ lời hứa (keeps her promises) nên có thể tin tưởng (trust).", "unit": 3}, {"q": "Peter loves playing football, basketball and tennis. He is the most _____ student in our class.", "opts": ["serious", "creative", "sporty", "sensitive"], "answer": 2, "why": "Sporty = yêu thích và tích cực chơi thể thao. Ba môn football, basketball, tennis là gợi ý trực tiếp.", "unit": 3}];let index=0;const revealed=new Set();const $=id=>document.getElementById(id);const unitNames=['MY NEW SCHOOL','MY HOUSE','MY FRIENDS'];
function draw(){const x=DATA[index];$('counter').textContent=`Câu ${index+1}/30`;$('unit').textContent=`UNIT ${x.unit}`;$('heading').textContent=`UNIT ${x.unit} – ${unitNames[x.unit-1]}`;$('question').textContent=`Question ${index+1}. ${x.q}`;$('options').innerHTML='';const show=revealed.has(index);x.opts.forEach((op,k)=>{const div=document.createElement('div');div.className='option'+(show&&k===x.answer?' correct':'');const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[k];const content=document.createElement('span');content.textContent=op;div.append(letter,content);$('options').append(div)});$('explain').classList.toggle('hidden',!show);$('explain').innerHTML=show?`<b>Đáp án đúng: ${'ABCD'[x.answer]}. ${escapeHTML(x.opts[x.answer])}</b><div>${escapeHTML(x.why)}</div>`:'';$('reveal').textContent=show?'🙈 Ẩn đáp án':'✓ Hiện đáp án + giải thích';$('prev').disabled=index===0;$('next').disabled=index===29;$('seen').textContent=`Đã chữa ${revealed.size}/30`;$('bar').style.width=`${revealed.size/30*100}%`;const nav=$('numbers');nav.innerHTML='';DATA.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(i===index?'active ':'')+(revealed.has(i)?'done':'');b.setAttribute('aria-label',`Câu ${i+1}`);b.onclick=()=>{index=i;draw();scrollTop()};nav.append(b)})}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}function toggle(){revealed.has(index)?revealed.delete(index):revealed.add(index);draw()}$('reveal').onclick=toggle;$('prev').onclick=()=>{if(index>0){index--;draw();scrollTop()}};$('next').onclick=()=>{if(index<29){index++;draw();scrollTop()}};$('reset').onclick=()=>{if(confirm('Ẩn đáp án của tất cả 30 câu?')){revealed.clear();index=0;draw()}};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&e.code==='Space')return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'&&index<29){index++;draw()}else if(e.key==='ArrowLeft'&&index>0){index--;draw()}});draw();
</script></body></html>
